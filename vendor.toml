# Third-party assets saved to docs/vendor/ during docs build

# Fontsource fonts, written to fonts/ with a generated fonts.css
[fonts]
version = "5.3.0"
subsets = ["latin", "latin-ext"]
text = { name = "roboto", weights = [300, 400, 500, 700] }
code = { name = "roboto-mono", weights = [400, 700] }

# Files saved to the given paths
[files]
# Zensical loads GLightbox from unpkg.com unless it's already present
"glightbox/glightbox.min.css" = "https://cdn.jsdelivr.net/npm/glightbox@3.3.1/dist/css/glightbox.min.css"
"glightbox/glightbox.min.js" = "https://cdn.jsdelivr.net/npm/glightbox@3.3.1/dist/js/glightbox.min.js"
"glightbox/LICENSE.md" = "https://cdn.jsdelivr.net/npm/glightbox@3.3.1/LICENSE.md"

# Files saved to external/<host>/<path>
[external]
urls = [
